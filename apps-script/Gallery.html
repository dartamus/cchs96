<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--green:#00853e;--ink:#111611;--paper:#f6f3e9;--muted:#626b63;--line:#d9ded8}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:transparent;color:var(--ink)}
    .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}.count{font-size:13px;color:var(--muted)}button{background:#fff;border:1px solid var(--line);padding:8px 11px;font-weight:800;cursor:pointer}button:hover{border-color:var(--green);color:var(--green)}
    .gallery{columns:4 220px;column-gap:12px}.photo{break-inside:avoid;margin:0 0 12px;background:#fff;border:1px solid var(--line);overflow:hidden;box-shadow:3px 3px 0 rgba(0,0,0,.06)}.photo a{display:block}.photo img{display:block;width:100%;height:auto;background:#e4ebe5}.caption{padding:10px 11px}.category{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.09em;color:var(--green)}.caption p{margin:5px 0 0;font-size:13px;line-height:1.4;color:#4e5850}.by{font-size:11px;color:var(--muted);margin-top:6px}.empty{border:1px dashed #aeb9b0;background:#fff;padding:30px;text-align:center;color:var(--muted)}.loading{padding:25px;text-align:center;color:var(--muted)}
    @media(max-width:600px){.gallery{columns:2 145px}}
  </style>
</head>
<body>
  <div class="toolbar"><div class="count" id="count">Loading the archive…</div><button onclick="loadGallery()">Refresh</button></div>
  <div id="gallery" class="gallery"><div class="loading">Digging through the photo box…</div></div>
<script>
function esc(s){return String(s||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
function loadGallery(){
  document.getElementById('count').textContent='Loading the archive…';
  google.script.run
    .withSuccessHandler(renderGallery)
    .withFailureHandler(err=>{document.getElementById('gallery').innerHTML='<div class="empty">Could not load photos yet. '+esc(err.message)+'</div>';document.getElementById('count').textContent='Archive unavailable';})
    .listApprovedPhotos();
}
function renderGallery(photos){
  const g=document.getElementById('gallery');
  document.getElementById('count').textContent=`${photos.length} approved photo${photos.length===1?'':'s'}`;
  if(!photos.length){g.innerHTML='<div class="empty"><strong>The archive is ready.</strong><br>Approved photos will appear here automatically.</div>';return;}
  g.innerHTML=photos.map(p=>`<article class="photo"><a href="${esc(p.viewUrl)}" target="_blank" rel="noopener"><img loading="lazy" src="${esc(p.imageUrl)}" alt="${esc(p.name)}"></a><div class="caption"><div class="category">${esc(p.category)}</div>${p.note?`<p>${esc(p.note)}</p>`:''}${p.submitter?`<div class="by">Shared by ${esc(p.submitter)}</div>`:''}</div></article>`).join('');
}
loadGallery();
</script>
</body>
</html>
